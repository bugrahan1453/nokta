<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | Binance Futures Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo i {
            font-size: 3rem;
            color: #f0b90b;
            display: block;
            margin-bottom: 0.5rem;
        }

        .login-logo h1 {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .login-logo p {
            color: #888;
            font-size: 0.85rem;
            margin: 0;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 0.75rem 1rem;
            border-radius: 10px;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #f0b90b;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(240, 185, 11, 0.25);
        }

        .form-label {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }

        .btn-login {
            background: linear-gradient(135deg, #f0b90b, #d4a009);
            border: none;
            color: #000;
            font-weight: 700;
            padding: 0.75rem;
            border-radius: 10px;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #ffd700, #f0b90b);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(240, 185, 11, 0.4);
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.2);
            border-color: rgba(220, 53, 69, 0.4);
            color: #ff6b6b;
            border-radius: 10px;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #888;
        }

        .warning-badge {
            background: rgba(240, 185, 11, 0.1);
            border: 1px solid rgba(240, 185, 11, 0.3);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: #f0b90b;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <i class="bi bi-robot"></i>
            <h1>Trading Bot</h1>
            <p>Binance Futures Otomatik İşlem Sistemi</p>
        </div>

        <div class="warning-badge">
            <i class="bi bi-shield-lock"></i> Güvenli Erişim Gerekli
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label">Web Şifresi</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Şifrenizi girin"
                        autofocus
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn-login mt-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Giriş Yap
            </button>
        </form>

        <div class="mt-3 text-center">
            <small class="text-muted">
                <i class="bi bi-info-circle"></i>
                Şifre için <code>.env</code> dosyasındaki <code>WEB_PASSWORD</code> değerini kullanın.
            </small>
        </div>
    </div>
</body>
</html>
